<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Flappy Bird</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: block;
    overflow: hidden;
    font-family: -apple-system, 'Courier New', monospace;
    touch-action: manipulation;
  }
  #gameCanvas {
    position: fixed;
    top: 0;
    display: block;
    touch-action: none;
    cursor: pointer;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 10px 40px rgba(0,0,0,0.5);
  }
  .hidden-file-input {
    position: absolute;
    width: 0;
    height: 0;
    opacity: 0;
    overflow: hidden;
    pointer-events: none;
  }
</style>
</head>
<body>
<input type="file" id="flapFileInput" accept="audio/*" class="hidden-file-input">
<input type="file" id="scoreFileInput" accept="audio/*" class="hidden-file-input">
<input type="file" id="hitFileInput" accept="audio/*" class="hidden-file-input">
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W, H;
const STATUS_H = 0;
const GROUND_TOP_H = 22;
const GROUND_H = 150;
let PLAY_BOTTOM;

// Portrait phone-style aspect ratio
const ASPECT_RATIO = 9 / 16;
const MIN_GAME_WIDTH = 300;
const MAX_GAME_WIDTH = 520;
const MIN_GAME_HEIGHT = 480;
const MAX_GAME_HEIGHT = 860;
const SCREEN_MARGIN = 24;

// Physics constants
const GRAVITY = 0.36;
const FLAP_VELOCITY = -5.6;
const PIPE_SPEED = 2.0;
const PIPE_GAP = 125;
const PIPE_SPACING = 215;
const PIPE_WIDTH = 60;
const GROUND_SPEED_FACTOR = 0.35;
const BIRD_W = 40, BIRD_H = 32;

// Cached font strings
const FONTS = {
  title: "bold 26px 'Courier New', monospace",
  scoreLarge: "bold 14px 'Courier New', monospace",
  scoreSmall: "bold 13px 'Courier New', monospace",
  label: "bold 12px 'Courier New', monospace",
  small: "bold 11px 'Courier New', monospace",
  tiny: "bold 9px 'Courier New', monospace",
  smaller: "10px 'Courier New', monospace"
};

const OUTLINE = '#4a2c3a';

// Bird color options
const COLORS = [
  { name: 'Yellow', body: '#f8cf3c', dark: '#f0a91f' },
  { name: 'Red',    body: '#ef5b3c', dark: '#d43a22' },
  { name: 'Blue',   body: '#3ca8ef', dark: '#1f84cc' },
  { name: 'Green',  body: '#6fd15a', dark: '#4bab3a' },
  { name: 'Purple', body: '#b463e0', dark: '#9540c4' },
];

// Game state
let state = 'start';
let frame = 0;
let score = 0;
let best = parseInt(localStorage.getItem('flappyBest') || '0', 10);
let groundX = 0;
let colorIndex = parseInt(localStorage.getItem('flappyColorIdx') || '0', 10);

if (colorIndex < 0 || colorIndex >= COLORS.length) colorIndex = 0;

let bird = { x: Math.max(70, W * 0.22), y: (STATUS_H + PLAY_BOTTOM) / 2, vel: 0, rotation: 0 };
let pipes = [];
let flashAlpha = 0;
let deadFallDone = false;
let trail = [];
let trailIndex = 0;
let lastScoreWasNewBest = false;

// Audio
const hitSoundDataURL = "data:audio/mpeg;base64,SUQzBAAAAAABAFRYWFgAAAASAAADbWFqb3JfYnJhbmQAZGFzaABUWFhYAAAAEQAAA21pbm9yX3ZlcnNpb24AMABUWFhYAAAAHAAAA2NvbXBhdGlibGVfYnJhbmRzAGlzbzZtcDQxAFRTU0UAAAA[...]";
const hitSoundAudio = new Audio(hitSoundDataURL);
hitSoundAudio.preload = 'auto';
let hitSoundUnlocked = false;

let customFlapAudio = null;
let customScoreAudio = null;
let settingsOpen = false;
let audioCtx;

// Resize debounce
let resizeTimeout;

/**
 * Responsive canvas sizing with throttled resize
 */
function resizeCanvas() {
  const vv = window.visualViewport;
  const viewW = Math.round(vv ? vv.width : window.innerWidth);
  const viewH = Math.round(vv ? vv.height : window.innerHeight);

  const availW = Math.max(1, viewW - SCREEN_MARGIN * 2);
  const availH = Math.max(1, viewH - SCREEN_MARGIN * 2);

  let targetH = availH;
  let targetW = targetH * ASPECT_RATIO;
  if (targetW > availW) {
    targetW = availW;
    targetH = targetW / ASPECT_RATIO;
  }
  targetW = Math.min(MAX_GAME_WIDTH, Math.max(MIN_GAME_WIDTH, targetW));
  targetH = Math.min(MAX_GAME_HEIGHT, Math.max(MIN_GAME_HEIGHT, targetH));
  targetW = Math.min(targetW, viewW);
  targetH = Math.min(targetH, viewH);

  W = Math.round(targetW);
  H = Math.round(targetH);
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.style.left = Math.round((viewW - W) / 2) + 'px';
  canvas.style.top = Math.round((viewH - H) / 2) + 'px';
  PLAY_BOTTOM = H - GROUND_H - GROUND_TOP_H;
}

function throttledResize() {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(resizeCanvas, 150);
}

resizeCanvas();
window.addEventListener('resize', throttledResize);
window.addEventListener('orientationchange', throttledResize);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', throttledResize);
}

// ---------- Audio Functions ----------
function unlockHitSound() {
  if (hitSoundUnlocked) return;
  hitSoundUnlocked = true;
  try {
    const p = hitSoundAudio.play();
    if (p && p.catch) p.catch(() => {});
    hitSoundAudio.pause();
    hitSoundAudio.currentTime = 0;
  } catch (e) { console.warn('hit sound unlock error:', e); }
}

function playHitSound() {
  try {
    hitSoundAudio.currentTime = 0;
    const p = hitSoundAudio.play();
    if (p && p.catch) p.catch((err) => console.warn('hit sound blocked:', err));
  } catch (e) { console.warn('hit sound error:', e); }
}

function ensureAudio() {
  if (!audioCtx) {
    try { 
      audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
    } catch(e) { 
      console.warn('AudioContext creation failed:', e);
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch((e) => console.warn('AudioContext resume failed:', e));
  }
}

/**
 * Generate a beep sound using Web Audio API
 */
function beep(freq, dur, type='square', vol=0.15) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; 
    o.frequency.value = freq; 
    g.gain.value = vol;
    o.connect(g); 
    g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {
    console.warn('beep error:', e);
  }
}

function sfxFlap() {
  if (customFlapAudio) { playCustomAudio(customFlapAudio); return; }
  beep(500, 0.09, 'square', 0.28);
}

function sfxScore() {
  if (customScoreAudio) { playCustomAudio(customScoreAudio); return; }
  beep(950, 0.14, 'sine', 0.35);
}

function sfxHit() { beep(120, 0.3, 'sawtooth', 0.2); }
function sfxSelect() { beep(700, 0.05, 'square', 0.08); }

// ---------- Custom Audio ----------
function playCustomAudio(audio) {
  try {
    audio.currentTime = 0;
    const p = audio.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}

function unlockCustomAudio(audio) {
  try {
    const p = audio.play();
    if (p && p.catch) p.catch(() => {});
    audio.pause();
    audio.currentTime = 0;
  } catch (e) {}
}

/**
 * Generic audio file loader
 */
function loadAudioFile(file, onReady) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const audio = new Audio(reader.result);
    audio.preload = 'auto';
    unlockCustomAudio(audio);
    onReady(audio);
  };
  reader.onerror = () => console.warn('FileReader error:', reader.error);
  reader.readAsDataURL(file);
}

const flapFileInput = document.getElementById('flapFileInput');
const scoreFileInput = document.getElementById('scoreFileInput');
const hitFileInput = document.getElementById('hitFileInput');

flapFileInput.addEventListener('change', (e) => {
  const file = e.target.files?.[0];
  loadAudioFile(file, (audio) => { customFlapAudio = audio; });
});

scoreFileInput.addEventListener('change', (e) => {
  const file = e.target.files?.[0];
  loadAudioFile(file, (audio) => { customScoreAudio = audio; });
});

hitFileInput.addEventListener('change', (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    hitSoundAudio.src = reader.result;
    hitSoundUnlocked = false;
    unlockHitSound();
  };
  reader.onerror = () => console.warn('FileReader error:', reader.error);
  reader.readAsDataURL(file);
});

function pickCustomSound(target) {
  ensureAudio();
  if (target === 'flap') flapFileInput.click();
  else if (target === 'score') scoreFileInput.click();
  else if (target === 'hit') hitFileInput.click();
}

function resetCustomSound(target) {
  if (target === 'flap') { customFlapAudio = null; flapFileInput.value = ''; }
  else if (target === 'score') { customScoreAudio = null; scoreFileInput.value = ''; }
  else if (target === 'hit') {
    hitSoundAudio.src = hitSoundDataURL;
    hitSoundUnlocked = false;
    hitFileInput.value = '';
  }
}

function previewCustomSound(target) {
  ensureAudio();
  if (target === 'flap') sfxFlap();
  else if (target === 'score') sfxScore();
  else if (target === 'hit') { unlockHitSound(); playHitSound(); }
}

// ---------- Game Reset ----------
function resetGame() {
  bird.y = (STATUS_H + PLAY_BOTTOM) / 2;
  bird.vel = 0;
  bird.rotation = 0;
  pipes = [];
  score = 0;
  frame = 0;
  flashAlpha = 0;
  deadFallDone = false;
  trail = [];
  trailIndex = 0;
  settingsOpen = false;
  spawnInitialPipes();
}

function spawnInitialPipes() {
  let x = W + 120;
  for (let i = 0; i < 3; i++) {
    addPipe(x);
    x += PIPE_SPACING;
  }
}

/**
 * Add a new pipe with random height variation
 */
function addPipe(x) {
  const minTop = STATUS_H + 25;
  const maxTop = Math.max(minTop + 20, PLAY_BOTTOM - PIPE_GAP - 25);
  const prev = pipes.length ? pipes[pipes.length - 1].top : null;

  let topHeight;
  if (prev === null) {
    topHeight = Math.random() * (maxTop - minTop) + minTop;
  } else {
    const minDiff = Math.min(35, (maxTop - minTop) * 0.15);
    const maxDiff = Math.min(90, (maxTop - minTop) * 0.4);
    let tries = 0;
    do {
      topHeight = Math.random() * (maxTop - minTop) + minTop;
      tries++;
    } while ((Math.abs(topHeight - prev) < minDiff || Math.abs(topHeight - prev) > maxDiff) && tries < 20);
  }

  pipes.push({ x, top: topHeight, passed: false });
}

function flap() {
  ensureAudio();
  unlockHitSound();
  if (state === 'start') { state = 'play'; bird.vel = FLAP_VELOCITY; sfxFlap(); }
  else if (state === 'play') { bird.vel = FLAP_VELOCITY; sfxFlap(); }
  else if (state === 'dead' && deadFallDone) { resetGame(); state = 'start'; }
}

// ---------- Hit Testing ----------
const SWATCH_Y = () => PLAY_BOTTOM - 140;
const SWATCH_SIZE = 30;
const SWATCH_GAP = 14;

function swatchRects() {
  const total = COLORS.length * SWATCH_SIZE + (COLORS.length - 1) * SWATCH_GAP;
  const startX = W/2 - total/2;
  return COLORS.map((c, i) => ({
    x: startX + i * (SWATCH_SIZE + SWATCH_GAP),
    y: SWATCH_Y(),
    w: SWATCH_SIZE,
    h: SWATCH_SIZE,
    idx: i
  }));
}

function settingsIconRect() {
  return { x: W - 44, y: 12, w: 32, h: 32 };
}

function settingsPanelLayout() {
  const panelW = Math.min(280, Math.max(W - 40, 200));
  const panelH = 260;
  const x = Math.max(20, W/2 - panelW/2);
  const y = Math.max(20, (STATUS_H + PLAY_BOTTOM) / 2 - panelH/2);
  const rowH = 56;
  const rows = ['flap', 'score', 'hit'].map((target, i) => ({
    target,
    y: y + 50 + i * rowH,
    h: rowH - 10,
  }));
  return { x, y, w: panelW, h: panelH, rows, closeBtn: { x: x + panelW - 34, y: y + 10, w: 24, h: 24 } };
}

function handleSettingsPanelTap(px, py) {
  const layout = settingsPanelLayout();
  const c = layout.closeBtn;
  if (px >= c.x && px <= c.x + c.w && py >= c.y && py <= c.y + c.h) {
    settingsOpen = false;
    return true;
  }
  for (const row of layout.rows) {
    const changeBtn = { x: layout.x + layout.w - 150, y: row.y, w: 90, h: row.h };
    const resetBtn = { x: layout.x + layout.w - 54, y: row.y, w: 34, h: row.h };
    const labelZone = { x: layout.x + 10, y: row.y, w: changeBtn.x - (layout.x + 10) - 6, h: row.h };
    if (px >= changeBtn.x && px <= changeBtn.x + changeBtn.w && py >= changeBtn.y && py <= changeBtn.y + changeBtn.h) {
      pickCustomSound(row.target);
      return true;
    }
    if (px >= resetBtn.x && px <= resetBtn.x + resetBtn.w && py >= resetBtn.y && py <= resetBtn.y + resetBtn.h) {
      resetCustomSound(row.target);
      return true;
    }
    if (px >= labelZone.x && px <= labelZone.x + labelZone.w && py >= labelZone.y && py <= labelZone.y + labelZone.h) {
      previewCustomSound(row.target);
      return true;
    }
  }
  if (px >= layout.x && px <= layout.x + layout.w && py >= layout.y && py <= layout.y + layout.h) return true;
  return false;
}

function handlePointer(px, py) {
  const gear = settingsIconRect();
  if (state === 'start' && px >= gear.x && px <= gear.x + gear.w && py >= gear.y && py <= gear.y + gear.h) {
    settingsOpen = !settingsOpen;
    return;
  }
  if (settingsOpen) {
    handleSettingsPanelTap(px, py);
    return;
  }
  if (state === 'start') {
    const rects = swatchRects();
    for (const r of rects) {
      if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) {
        colorIndex = r.idx;
        try {
          localStorage.setItem('flappyColorIdx', colorIndex);
        } catch (e) { console.warn('localStorage error:', e); }
        sfxSelect();
        return;
      }
    }
  }
  flap();
}

function getCanvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
});

canvas.addEventListener('mousedown', (e) => {
  e.preventDefault();
  const { x, y } = getCanvasCoords(e.clientX, e.clientY);
  handlePointer(x, y);
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  const { x, y } = getCanvasCoords(t.clientX, t.clientY);
  handlePointer(x, y);
}, { passive: false });

// ---------- Physics Update ----------
/**
 * Update bird physics (gravity, velocity, rotation)
 */
function updateBirdPhysics() {
  bird.vel += GRAVITY;
  bird.y += bird.vel;
  bird.rotation = bird.vel < 0 ? -22 : Math.min(80, bird.rotation + 4);
}

/**
 * Update pipe positions and spawn new ones
 */
function updatePipes() {
  for (let p of pipes) p.x -= PIPE_SPEED;

  if (pipes.length && pipes[0].x < -PIPE_WIDTH) {
    pipes.shift();
    addPipe(pipes[pipes.length - 1].x + PIPE_SPACING);
  }

  // Check for scoring
  for (let p of pipes) {
    if (!p.passed && p.x + PIPE_WIDTH < bird.x) { 
      p.passed = true; 
      score++; 
      sfxScore(); 
    }
  }
}

/**
 * Check collision with pipes, ground, and ceiling
 */
function checkCollisions() {
  const birdLeft = bird.x - BIRD_W/2 + 3;
  const birdRight = bird.x + BIRD_W/2 - 2;
  const birdTop = bird.y - BIRD_H/2 + 2;
  const birdBottom = bird.y + BIRD_H/2 - 2;

  // Ground collision
  if (birdBottom >= PLAY_BOTTOM) { 
    bird.y = PLAY_BOTTOM - BIRD_H/2 + 6; 
    die(); 
    return;
  }

  // Ceiling collision
  if (birdTop <= STATUS_H) { 
    bird.y = STATUS_H + BIRD_H/2 - 6; 
    die(); 
    return;
  }

  // Pipe collision
  for (let p of pipes) {
    if (birdRight > p.x && birdLeft < p.x + PIPE_WIDTH) {
      if (birdTop < p.top || birdBottom > p.top + PIPE_GAP) {
        die();
        return;
      }
    }
  }
}

/**
 * Update trail particles with optimized array management
 */
function updateTrail() {
  if (frame % 2 === 0) {
    if (trail.length < 50) {
      trail.push({ x: bird.x - BIRD_W/2, y: bird.y + (Math.random()*10-5), life: 1 });
    } else {
      trail[trailIndex] = { x: bird.x - BIRD_W/2, y: bird.y + (Math.random()*10-5), life: 1 };
      trailIndex = (trailIndex + 1) % 50;
    }
  }

  for (const t of trail) { 
    t.x -= PIPE_SPEED * 1.5; 
    t.life -= 0.04; 
  }
}

/**
 * Main game update loop
 */
function update() {
  groundX -= PIPE_SPEED * GROUND_SPEED_FACTOR;

  if (state === 'play') {
    updateBirdPhysics();
    updatePipes();
    checkCollisions();
    updateTrail();
    frame++;
  } else if (state === 'dead') {
    if (!deadFallDone) {
      bird.vel += GRAVITY;
      bird.y += bird.vel;
      bird.rotation = Math.min(80, bird.rotation + 6);
      if (bird.y + BIRD_H/2 >= PLAY_BOTTOM) { 
        bird.y = PLAY_BOTTOM - BIRD_H/2; 
        deadFallDone = true; 
      }
    }
    if (flashAlpha > 0) flashAlpha -= 0.05;
    updateTrail();
    frame++;
  } else {
    // Start state - idle animation
    bird.y = (STATUS_H + PLAY_BOTTOM) / 2 + Math.sin(frame * 0.1) * 6;
    frame++;
  }
}

function die() {
  if (state !== 'play') return;
  state = 'dead';
  flashAlpha = 0.8;
  playHitSound();
  lastScoreWasNewBest = score > best;
  if (lastScoreWasNewBest) { 
    best = score; 
    try {
      localStorage.setItem('flappyBest', best);
    } catch (e) { console.warn('localStorage error:', e); }
  }
}

// ---------- Rendering ----------
function drawSky() {
  ctx.fillStyle = '#4ec0ca';
  ctx.fillRect(0, 0, W, PLAY_BOTTOM);
}

function drawCloudCityBand() {
  const bandH = Math.min(180, PLAY_BOTTOM * 0.28);
  const bandTop = PLAY_BOTTOM - bandH;
  const scallopR = 24;

  ctx.fillStyle = '#eaf6ee';
  ctx.beginPath();
  ctx.moveTo(0, bandTop + scallopR + 10);
  for (let x = 0; x <= W + scallopR; x += scallopR * 1.5) {
    ctx.arc(x, bandTop + scallopR, scallopR, Math.PI, 0);
  }
  ctx.lineTo(W, PLAY_BOTTOM);
  ctx.lineTo(0, PLAY_BOTTOM);
  ctx.closePath();
  ctx.fill();

  ctx.save();
  ctx.globalAlpha = 0.45;
  const buildings = [
    {w: 28, h: 70}, {w: 36, h: 50}, {w: 24, h: 85}, {w: 32, h: 60},
    {w: 26, h: 75}, {w: 38, h: 45}, {w: 22, h: 80}, {w: 30, h: 55}
  ];
  const bOffset = (frame * 0.3) % 90;
  let bx = -90 + bOffset;
  let i = 0;
  const buildingBase = PLAY_BOTTOM - 34;
  while (bx < W + 90) {
    const b = buildings[i % buildings.length];
    const by = buildingBase - b.h;
    ctx.fillStyle = '#bfe0e6';
    ctx.fillRect(bx, by, b.w, b.h + 40);
    ctx.strokeStyle = 'rgba(150,200,205,0.6)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, b.w, b.h + 40);
    ctx.fillStyle = 'rgba(150,200,205,0.6)';
    for (let wy = by + 8; wy < by + b.h - 6; wy += 11) {
      for (let wx = bx + 5; wx < bx + b.w - 5; wx += 9) {
        ctx.fillRect(wx, wy, 4, 6);
      }
    }
    bx += b.w + 12;
    i++;
  }
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#7fd68c';
  const bushOffset = (frame * 0.5) % 40;
  for (let x = -40 + bushOffset; x < W + 40; x += 40) {
    ctx.beginPath();
    ctx.arc(x, PLAY_BOTTOM - 24, 22, Math.PI, 0);
    ctx.fill();
  }
  ctx.restore();
}

function drawGrassStrip() {
  const grassY = PLAY_BOTTOM - 20;
  ctx.fillStyle = '#6fd35a';
  ctx.fillRect(0, grassY, W, 20);
}

function drawPipes() {
  for (let p of pipes) {
    drawPipeSegment(p.x, 0, PIPE_WIDTH, p.top, true);
    const bottomY = p.top + PIPE_GAP;
    drawPipeSegment(p.x, bottomY, PIPE_WIDTH, PLAY_BOTTOM - bottomY, false);
  }
}

function drawPipeSegment(x, y, w, h, isTop) {
  ctx.fillStyle = '#71c837';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#a6e86a';
  ctx.fillRect(x + 5, y, 8, h);
  ctx.fillStyle = '#4f9c26';
  ctx.fillRect(x + w - 10, y, 10, h);
  ctx.strokeStyle = '#3b5d2f';
  ctx.lineWidth = 3;
  ctx.strokeRect(x + 1.5, y, w - 3, h);

  const capH = 26;
  const capY = isTop ? y + h - capH : y;
  ctx.fillStyle = '#71c837';
  ctx.fillRect(x - 4, capY, w + 8, capH);
  ctx.fillStyle = '#a6e86a';
  ctx.fillRect(x + 1, capY, 8, capH);
  ctx.fillStyle = '#4f9c26';
  ctx.fillRect(x + w - 5, capY, 12, capH);
  ctx.strokeStyle = '#3b5d2f';
  ctx.strokeRect(x - 4 + 1.5, capY, w + 8 - 3, capH);
}

function drawGround() {
  const groundY = PLAY_BOTTOM;
  ctx.fillStyle = '#ded99a';
  ctx.fillRect(0, groundY, W, GROUND_TOP_H);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, groundY, W, GROUND_TOP_H);
  ctx.clip();
  ctx.fillStyle = '#c8b86a';
  const stripeW = 18;
  const period = stripeW * 2;
  const stripeOffset = ((groundX % period) + period) % period;
  for (let x = stripeOffset - period; x < W + GROUND_TOP_H; x += period) {
    ctx.beginPath();
    ctx.moveTo(x, groundY + GROUND_TOP_H);
    ctx.lineTo(x + GROUND_TOP_H, groundY);
    ctx.lineTo(x + GROUND_TOP_H + stripeW, groundY);
    ctx.lineTo(x + stripeW, groundY + GROUND_TOP_H);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = '#3b5d2f';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();

  ctx.fillStyle = '#e0c284';
  ctx.fillRect(0, groundY + GROUND_TOP_H, W, GROUND_H);
}

function drawTrail() {
  for (const t of trail) {
    if (t.life <= 0) continue;
    ctx.save();
    ctx.globalAlpha = t.life * 0.5;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    roundRect(t.x - 14, t.y - 3, 18, 6, 3);
    ctx.fill();
    ctx.restore();
  }
}

function drawBird() {
  const c = COLORS[colorIndex];
  const flap = state === 'dead' ? 0 : Math.sin(frame * 0.45);

  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rotation * Math.PI / 180);

  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // body
  ctx.beginPath();
  ctx.ellipse(2, 2, 19, 17, 0, 0, Math.PI * 2);
  ctx.fillStyle = c.dark;
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(2, 0, 19, 17, 0, 0, Math.PI * 2);
  ctx.fillStyle = c.body;
  ctx.fill();
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = OUTLINE;
  ctx.stroke();

  // wing (flapping)
  ctx.save();
  ctx.translate(-6, 4);
  ctx.rotate(flap * 0.35);
  ctx.beginPath();
  ctx.moveTo(-8, 6);
  ctx.quadraticCurveTo(4, -6 - flap * 4, 14, 0);
  ctx.quadraticCurveTo(4, 6, -8, 6);
  ctx.closePath();
  ctx.fillStyle = c.dark;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = OUTLINE;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-4, 3);
  ctx.quadraticCurveTo(4, -1, 10, 1);
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = OUTLINE;
  ctx.stroke();
  ctx.restore();

  // eye
  ctx.beginPath();
  ctx.ellipse(9, -6, 11, 12, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#fbf6ea';
  ctx.fill();
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = OUTLINE;
  ctx.stroke();

  // eyebrow
  ctx.beginPath();
  ctx.arc(6, -14, 8, Math.PI * 1.1, Math.PI * 1.9);
  ctx.lineWidth = 3;
  ctx.strokeStyle = OUTLINE;
  ctx.stroke();

  if (state === 'dead') {
    ctx.save();
    ctx.translate(9, -6);
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.strokeStyle = OUTLINE;
    const r = 5;
    ctx.beginPath();
    ctx.moveTo(-r, -r);
    ctx.lineTo(r, r);
    ctx.moveTo(r, -r);
    ctx.lineTo(-r, r);
    ctx.stroke();
    ctx.restore();
  } else {
    ctx.beginPath();
    ctx.ellipse(13, -4, 3.4, 4.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = OUTLINE;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(14.3, -6.5, 1.3, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  }

  // beak
  ctx.beginPath();
  ctx.moveTo(10, 2);
  ctx.quadraticCurveTo(26, -2, 30, 6);
  ctx.quadraticCurveTo(26, 15, 10, 12);
  ctx.quadraticCurveTo(6, 7, 10, 2);
  ctx.closePath();
  ctx.fillStyle = '#ef7a3c';
  ctx.fill();
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = OUTLINE;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(11, 7);
  ctx.quadraticCurveTo(22, 6.5, 28, 7);
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = OUTLINE;
  ctx.stroke();

  ctx.restore();
}

function drawScore(x, y, value, size) {
  ctx.font = `bold ${size}px 'Courier New', monospace`;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#3b5d2f';
  ctx.lineWidth = size / 10;
  ctx.strokeText(value, x, y);
  ctx.fillText(value, x, y);
}

function drawScoreLine() {
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W/2 - 90, STATUS_H + 83);
  ctx.lineTo(W/2 + 90, STATUS_H + 83);
  ctx.stroke();
}

function drawColorSwatches() {
  const rects = swatchRects();
  for (const r of rects) {
    ctx.fillStyle = COLORS[r.idx].body;
    ctx.beginPath();
    roundRect(r.x, r.y, r.w, r.h, 6);
    ctx.fill();
    ctx.lineWidth = r.idx === colorIndex ? 4 : 2;
    ctx.strokeStyle = r.idx === colorIndex ? '#ffffff' : OUTLINE;
    ctx.stroke();
  }
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = 2;
  ctx.textAlign = 'center';
  ctx.font = FONTS.label;
  ctx.strokeText('Choose your bird', W/2, SWATCH_Y() - 10);
  ctx.fillText('Choose your bird', W/2, SWATCH_Y() - 10);
}

function drawSettingsIcon() {
  const g = settingsIconRect();
  const cx = g.x + g.w / 2, cy = g.y + g.h / 2;
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, g.w / 2, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.translate(cx, cy);
  ctx.fillStyle = '#fff';
  const r1 = 4.5, r2 = 8, teeth = 6;
  ctx.beginPath();
  for (let i = 0; i < teeth; i++) {
    const a0 = (i / teeth) * Math.PI * 2;
    const a1 = a0 + (Math.PI * 2) / teeth / 2;
    ctx.arc(0, 0, r2, a0, a1);
    ctx.arc(0, 0, r1, a1, a0, true);
  }
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.arc(0, 0, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawSettingsPanel() {
  const layout = settingsPanelLayout();

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#f5efce';
  ctx.strokeStyle = '#7a5c3e';
  ctx.lineWidth = 3;
  ctx.beginPath();
  roundRect(layout.x, layout.y, layout.w, layout.h, 10);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#7a5c3e';
  ctx.font = FONTS.small;
  ctx.textAlign = 'center';
  ctx.fillText('SOUND SETTINGS', layout.x + layout.w / 2, layout.y + 26);

  const labels = { flap: 'Flap sound', score: 'Score sound', hit: 'Hit sound' };
  const hasCustom = { flap: !!customFlapAudio, score: !!customScoreAudio, hit: hitSoundAudio.src !== hitSoundDataURL };

  for (const row of layout.rows) {
    ctx.textAlign = 'left';
    ctx.fillStyle = '#3b3b3b';
    ctx.font = FONTS.scoreSmall;
    ctx.fillText(labels[row.target], layout.x + 12, row.y + 20);
    ctx.font = FONTS.smaller;
    ctx.fillStyle = hasCustom[row.target] ? '#3f8a42' : '#8a7c5a';
    ctx.fillText(hasCustom[row.target] ? 'Custom — tap to preview' : 'Default — tap to preview', layout.x + 12, row.y + 36);

    const changeBtn = { x: layout.x + layout.w - 150, y: row.y, w: 90, h: row.h };
    const resetBtn = { x: layout.x + layout.w - 54, y: row.y, w: 34, h: row.h };

    ctx.fillStyle = '#ded99a';
    ctx.strokeStyle = '#7a5c3e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    roundRect(changeBtn.x, changeBtn.y, changeBtn.w, changeBtn.h, 6);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#3b3b3b';
    ctx.font = FONTS.small;
    ctx.textAlign = 'center';
    ctx.fillText('Choose file', changeBtn.x + changeBtn.w / 2, changeBtn.y + changeBtn.h / 2 + 4);

    ctx.fillStyle = '#f0a91f';
    ctx.strokeStyle = '#7a5c3e';
    ctx.beginPath();
    roundRect(resetBtn.x, resetBtn.y, resetBtn.w, resetBtn.h, 6);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#3b3b3b';
    ctx.font = FONTS.tiny;
    ctx.fillText('Reset', resetBtn.x + resetBtn.w / 2, resetBtn.y + resetBtn.h / 2 + 3);

    ctx.strokeStyle = 'rgba(122,92,62,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(layout.x + 8, row.y + row.h + 5);
    ctx.lineTo(layout.x + layout.w - 8, row.y + row.h + 5);
    ctx.stroke();
  }

  const c = layout.closeBtn;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.arc(c.x + c.w / 2, c.y + c.h / 2, c.w / 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  const pad = 6;
  ctx.moveTo(c.x + pad, c.y + pad);
  ctx.lineTo(c.x + c.w - pad, c.y + c.h - pad);
  ctx.moveTo(c.x + c.w - pad, c.y + pad);
  ctx.lineTo(c.x + pad, c.y + c.h - pad);
  ctx.stroke();
}

function drawStartScreen() {
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#3b5d2f';
  ctx.lineWidth = 3;
  ctx.font = FONTS.title;
  ctx.textAlign = 'center';
  ctx.strokeText('FLAPPY BIRD', W/2, STATUS_H + 70);
  ctx.fillText('FLAPPY BIRD', W/2, STATUS_H + 70);

  ctx.font = FONTS.scoreLarge;
  ctx.fillStyle = '#ffe066';
  ctx.strokeStyle = '#7a5c00';
  ctx.lineWidth = 2;
  ctx.strokeText(`BEST: ${best}`, W/2, STATUS_H + 96);
  ctx.fillText(`BEST: ${best}`, W/2, STATUS_H + 96);

  drawColorSwatches();

  ctx.font = FONTS.scoreLarge;
  ctx.strokeText('Click, tap, or press Space', W/2, PLAY_BOTTOM - 30);
  ctx.fillText('Click, tap, or press Space', W/2, PLAY_BOTTOM - 30);

  drawSettingsIcon();
  if (settingsOpen) drawSettingsPanel();
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, STATUS_H, W, PLAY_BOTTOM - STATUS_H);

  const centerY = (STATUS_H + PLAY_BOTTOM) / 2;

  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#3b5d2f';
  ctx.lineWidth = 3;
  ctx.font = FONTS.title;
  ctx.textAlign = 'center';
  ctx.strokeText('GAME OVER', W/2, centerY - 130);
  ctx.fillText('GAME OVER', W/2, centerY - 130);

  if (lastScoreWasNewBest) {
    ctx.fillStyle = '#ffe066';
    ctx.strokeStyle = '#7a5c00';
    ctx.lineWidth = 2.5;
    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.strokeText('NEW BEST!', W/2, centerY - 105);
    ctx.fillText('NEW BEST!', W/2, centerY - 105);
  }

  const boxY = centerY - 85;
  ctx.fillStyle = '#ded99a';
  ctx.strokeStyle = '#7a5c3e';
  ctx.lineWidth = 3;
  ctx.fillRect(W/2 - 90, boxY, 180, 100);
  ctx.strokeRect(W/2 - 90, boxY, 180, 100);

  ctx.fillStyle = '#000';
  ctx.font = FONTS.scoreSmall;
  ctx.textAlign = 'center';
  ctx.fillText('Score', W/2 - 45, boxY + 30);
  ctx.fillText('Best', W/2 + 45, boxY + 30);

  ctx.font = 'bold 28px "Courier New", monospace';
  drawScore(W/2 - 45, boxY + 70, score, 28);
  drawScore(W/2 + 45, boxY + 70, best, 28);

  ctx.font = FONTS.scoreLarge;
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#3b5d2f';
  ctx.lineWidth = 2;
  ctx.strokeText('Tap to play again', W/2, centerY + 130);
  ctx.fillText('Tap to play again', W/2, centerY + 130);
}

// Polyfill for roundRect
function roundRect(x, y, w, h, r) {
  if (!ctx.roundRect) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  } else {
    ctx.roundRect(x, y, w, h, r);
  }
}

function draw() {
  drawSky();
  drawCloudCityBand();
  drawGrassStrip();
  drawPipes();
  drawGround();
  drawTrail();
  drawBird();

  if (state === 'start') {
    drawStartScreen();
  } else if (state === 'dead') {
    drawGameOver();
    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
      ctx.fillRect(0, 0, W, H);
    }
  } else {
    drawScore(W/2, STATUS_H + 50, score, 50);
    drawScoreLine();
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
