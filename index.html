<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flying Bird</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#6ec6ff;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

canvas{
    border:4px solid #000;
    border-radius:10px;
    background:linear-gradient(#7fd8ff,#d8f7ff);
}

#score{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    font-size:40px;
    font-weight:bold;
    color:white;
    text-shadow:2px 2px 5px black;
}

#message{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    font-size:26px;
    font-weight:bold;
    text-shadow:2px 2px 6px black;
}
</style>

</head>

<body>

<div id="score">0</div>

<div id="message">
Press SPACE or Click<br><br>
to Start
</div>

<canvas id="game" width="400" height="600"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const scoreText=document.getElementById("score");
const message=document.getElementById("message");

let started=false;
let gameOver=false;
let score=0;

const gravity=0.45;
const jump=-8;

const bird={
    x:90,
    y:250,
    width:34,
    height:26,
    velocity:0,

    draw(){

        ctx.fillStyle="#FFD93B";

        ctx.beginPath();

        ctx.ellipse(
            this.x,
            this.y,
            this.width/2,
            this.height/2,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="white";
        ctx.beginPath();
        ctx.arc(
            this.x+8,
            this.y-5,
            5,
            0,
            Math.PI*2
        );
        ctx.fill();

        ctx.fillStyle="black";
        ctx.beginPath();
        ctx.arc(
            this.x+9,
            this.y-5,
            2,
            0,
            Math.PI*2
        );
        ctx.fill();

        ctx.fillStyle="orange";

        ctx.beginPath();

        ctx.moveTo(this.x+17,this.y);

        ctx.lineTo(this.x+28,this.y-3);

        ctx.lineTo(this.x+17,this.y+4);

        ctx.fill();

    },

    update(){

        if(!started) return;

        this.velocity+=gravity;

        this.y+=this.velocity;

    },

    flap(){

        this.velocity=jump;

    }

};

let pipes=[];

const gap=170;
const pipeWidth=70;

function createPipe(){

    let topHeight=
    Math.random()*250+60;

    pipes.push({

        x:canvas.width,

        top:topHeight,

        bottom:
        canvas.height-topHeight-gap,

        passed:false

    });

}function drawPipes(){

    ctx.fillStyle="#2ecc71";

    pipes.forEach(pipe=>{

        // Top pipe
        ctx.fillRect(
            pipe.x,
            0,
            pipeWidth,
            pipe.top
        );

        ctx.fillStyle="#27ae60";
        ctx.fillRect(
            pipe.x-4,
            pipe.top-20,
            pipeWidth+8,
            20
        );

        ctx.fillStyle="#2ecc71";

        // Bottom pipe
        ctx.fillRect(
            pipe.x,
            canvas.height-pipe.bottom,
            pipeWidth,
            pipe.bottom
        );

        ctx.fillStyle="#27ae60";
        ctx.fillRect(
            pipe.x-4,
            canvas.height-pipe.bottom,
            pipeWidth+8,
            20
        );

        ctx.fillStyle="#2ecc71";

    });

}

function updatePipes(){

    if(!started || gameOver) return;

    pipes.forEach(pipe=>{

        pipe.x-=2.5;

        // Score
        if(!pipe.passed && pipe.x+pipeWidth<bird.x){

            pipe.passed=true;
            score++;
            scoreText.innerText=score;

        }

        // Collision
        if(

            bird.x+bird.width/2>pipe.x &&
            bird.x-bird.width/2<pipe.x+pipeWidth &&

            (

                bird.y-bird.height/2<pipe.top ||

                bird.y+bird.height/2>
                canvas.height-pipe.bottom

            )

        ){

            gameOver=true;

            message.innerHTML=
            "Game Over<br><br>Click or Press SPACE";

            message.style.display="block";

        }

    });

    // Remove off-screen pipes
    pipes=pipes.filter(pipe=>pipe.x>-pipeWidth);

}

let spawnTimer=0;

function background(){

    ctx.fillStyle="#87CEEB";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // Ground
    ctx.fillStyle="#7CFC00";
    ctx.fillRect(
        0,
        canvas.height-25,
        canvas.width,
        25
    );
}

function physics(){

    if(gameOver) return;

    bird.update();

    if(

        bird.y+bird.height/2>=canvas.height-25 ||

        bird.y-bird.height/2<=0

    ){

        gameOver=true;

        message.innerHTML=
        "Game Over<br><br>Click or Press SPACE";

        message.style.display="block";

    }

           }function gameLoop(){

    background();

    if(started && !gameOver){

        spawnTimer++;

        if(spawnTimer>=90){

            createPipe();
            spawnTimer=0;

        }

        updatePipes();

    }

    drawPipes();

    physics();

    bird.draw();

    requestAnimationFrame(gameLoop);

}

function resetGame(){

    bird.y=250;
    bird.velocity=0;

    pipes=[];

    score=0;
    scoreText.innerText="0";

    spawnTimer=0;

    started=true;
    gameOver=false;

    message.style.display="none";

}

function handleInput(){

    if(!started){

        started=true;
        message.style.display="none";
    }

    if(gameOver){

        resetGame();
        return;
    }

    bird.flap();

}

window.addEventListener("keydown",e=>{

    if(e.code==="Space"){

        e.preventDefault();
        handleInput();

    }

});

canvas.addEventListener("mousedown",handleInput);

canvas.addEventListener("touchstart",e=>{

    e.preventDefault();
    handleInput();

},{passive:false});

gameLoop();

</script>

</body>
</html>
