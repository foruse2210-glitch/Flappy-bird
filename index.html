
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flappy bird</title>
    <style>
        /* Remove default browser spaces */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* Make container fill the complete screen dimensions */
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000; /* Black background padding */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Keep image perfectly responsive without distortion */
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover; 
            user-select: none; /* Prevents text-dragging overlays */
        }
    </style>
</head>
<body>

    <!-- Swap 'your-photo.jpg' with your local filename or a live URL link -->
    <img src="WebsiteUnderConstruction.jpg" alt="Featured Photo">

</body>
</html>
